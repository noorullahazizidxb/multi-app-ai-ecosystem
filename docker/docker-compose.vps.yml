services:
  redis-core:
    image: redis:7-alpine
    container_name: redis-core
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_super_secret} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api-resume:
    build:
      context: ..
      dockerfile: apps/api-resume/Dockerfile
    container_name: api-resume
    restart: always
    env_file: ../apps/api-resume/.env
    ports:
      - "4001:4001"
      - "4101:4101"
    depends_on:
      - redis-core

  api-fitness:
    build:
      context: ..
      dockerfile: apps/api-fitness/Dockerfile
    container_name: api-fitness
    restart: always
    env_file: ../apps/api-fitness/.env
    ports:
      - "4002:4002"
      - "4102:4102"
    depends_on:
      - redis-core

  api-freelance:
    build:
      context: ..
      dockerfile: apps/api-freelance/Dockerfile
    container_name: api-freelance
    restart: always
    env_file: ../apps/api-freelance/.env
    ports:
      - "4003:4003"
      - "4103:4103"
    depends_on:
      - redis-core

  api-content:
    build:
      context: ..
      dockerfile: apps/api-content/Dockerfile
    container_name: api-content
    restart: always
    env_file: ../apps/api-content/.env
    ports:
      - "4004:4004"
      - "4104:4104"
    depends_on:
      - redis-core

volumes:
  redis-data:

