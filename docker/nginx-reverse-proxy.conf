# Nginx Reverse Proxy for Multi-App AI Ecosystem (VPS Deployment)
# Production Domain: devminds.net
# Routes api.<app>.devminds.net and api-<app>.devminds.net to isolated container ports 4001-4004

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. CareerForge AI (api.careerforge.devminds.net & api-careerforge.devminds.net -> :4001, WS: 4101)
server {
    listen 80;
    server_name api.careerforge.devminds.net api-careerforge.devminds.net api.careerforge.example.com;

    location / {
        proxy_pass http://api-resume:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-ws {
        proxy_pass http://api-resume:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

